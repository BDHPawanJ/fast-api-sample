[project]
name = "fastapi-sample"
version = "1.0.0"
description = "FastAPI sample project for framework comparison"
authors = [
    {name = "Pawan Jaiswal", email = "pawan@example.com"}
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "alembic>=1.20.0",
    "bcrypt<4.1",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[c]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.1.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 88
include = ["*.py", "*.pyi"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
# Import sorting only (replaces isort); ruff format replaces black.
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.datamodel-codegen]
input = "openapi.yaml"
input-file-type = "openapi"
output = "app/api/schemas/generated.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.13"
# Inline constrained types (constr, conint, ...) instead of RootModel
# wrappers for optional constrained fields.
collapse-root-models = true
use-schema-description = true
enum-field-as-literal = "all"
output-datetime-class = "AwareDatetime"
use-double-quotes = true
disable-timestamp = true
keep-model-order = true
formatters = ["ruff-check", "ruff-format"]
custom-file-header = """# Generated by datamodel-codegen from openapi.yaml. Do not edit by hand.
# Regenerate with: make schemas"""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "debugpy>=1.8.22",
    "httpx==0.26.0",
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[tool.pyright]
include = ["app", "tests"]
# Generated from openapi.yaml; pydantic's constr()/conint() are not valid type
# expressions for static checkers.
exclude = ["app/api/schemas/generated.py"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers only import inward"
type = "layers"
layers = [
    "app.api",
    "app.infrastructure",
    "app.application",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay framework-free"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "starlette",
    "pydantic",
    "passlib",
    "jose",
]
